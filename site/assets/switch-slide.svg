<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 14" fill="none" stroke="#ffffff">
  <title>Slide switch</title>
  <rect x="1.3" y="1.3" width="25.4" height="11.4" rx="0.45" stroke-width="0.45"/>
  <circle cx="3.2" cy="3.2" r="0.45" stroke-width="0.28"/>
  <circle cx="24.8" cy="3.2" r="0.45" stroke-width="0.28"/>
  <circle cx="3.2" cy="10.8" r="0.45" stroke-width="0.28"/>
  <circle cx="24.8" cy="10.8" r="0.45" stroke-width="0.28"/>
  <rect x="4.4" y="4.6" width="19.2" height="4.8" rx="2.4" stroke-width="0.4"/>
  <g class="paddle-off">
    <rect x="4.9" y="5.1" width="8.2" height="3.8" rx="1.9" fill="transparent" stroke-width="0.4"/>
    <line x1="7.6" y1="6.1" x2="7.6" y2="7.9" stroke-width="0.28"/>
    <line x1="9.1" y1="6.1" x2="9.1" y2="7.9" stroke-width="0.28"/>
  </g>
  <g class="paddle-on" display="none">
    <rect x="14.9" y="5.1" width="8.2" height="3.8" rx="1.9" fill="transparent" stroke-width="0.4"/>
    <line x1="17.6" y1="6.1" x2="17.6" y2="7.9" stroke-width="0.28"/>
    <line x1="19.1" y1="6.1" x2="19.1" y2="7.9" stroke-width="0.28"/>
  </g>
</svg>
